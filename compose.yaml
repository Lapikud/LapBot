services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://lapbot:${POSTGRES_PASSWORD:-lapbot}@postgres:5432/lapbot
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lapbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lapbot}
      POSTGRES_DB: lapbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lapbot -d lapbot']
      interval: 5s
      timeout: 3s
      retries: 10
    # No published port: only the bot reaches the database.

volumes:
  pgdata:
