services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lapbot
      POSTGRES_PASSWORD: lapbot
      POSTGRES_DB: lapbot
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lapbot -d lapbot']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
