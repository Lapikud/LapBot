name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  check:
    name: CI
    uses: ./.github/workflows/ci.yml

  mirror:
    name: Push main to Gitea
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    concurrency:
      group: mirror
      cancel-in-progress: false

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Gitea SSH
        env:
          GITEA_DEPLOY_KEY: ${{ secrets.GITEA_DEPLOY_KEY }}
          GITEA_KNOWN_HOSTS: ${{ vars.GITEA_KNOWN_HOSTS }}
        run: |
          test -n "$GITEA_DEPLOY_KEY"
          test -n "$GITEA_KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$GITEA_DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$GITEA_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Push to Gitea
        env:
          GITEA_REMOTE: ${{ secrets.GITEA_REMOTE }}
        run: git push --force "$GITEA_REMOTE" HEAD:main
