services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lapbot
      POSTGRES_PASSWORD: lapbot
      POSTGRES_DB: lapbot_test
    ports:
      - '127.0.0.1:5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lapbot -d lapbot_test']
      interval: 2s
      timeout: 3s
      retries: 15
